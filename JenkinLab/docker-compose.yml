services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres   # Build a custom image
    container_name: pg-compose
    environment:
      POSTGRES_USER: etluser
      POSTGRES_PASSWORD: etlpassword
      POSTGRES_DB: wajiddb
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etluser -d wajiddb"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-app:
    build: .
    container_name: python-compose
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pg-network
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wajiddb
      DB_USER: etluser
      DB_PASS: etlpassword

networks:
  pg-network:
    driver: bridge